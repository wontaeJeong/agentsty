apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentsessions.agentcask.aidev.samsungds.net
spec:
  group: agentcask.aidev.samsungds.net
  scope: Namespaced
  names:
    plural: agentsessions
    singular: agentsession
    kind: AgentSession
    shortNames:
      - asess
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [userId, tool, repo, modelRef, resourceProfile, isolation, ttlSeconds]
              properties:
                userId:
                  type: string
                  minLength: 1
                tool:
                  type: string
                  enum: [opencode, claude-code, codex, openclaw, hermes, stub]
                repo:
                  type: object
                  required: [url, branch]
                  properties:
                    url:
                      type: string
                    branch:
                      type: string
                modelRef:
                  type: string
                  enum: [default]
                resourceProfile:
                  type: string
                  enum: [small, medium, large]
                isolation:
                  type: object
                  required: [profile]
                  properties:
                    profile:
                      type: string
                      enum: [default, kata]
                ttlSeconds:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 86400
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Provisioning, Running, Failed, Terminating, Expired, Succeeded]
                reason:
                  type: string
                message:
                  type: string
                podName:
                  type: string
                containerName:
                  type: string
                terminalReady:
                  type: boolean
                createdAt:
                  type: string
                  format: date-time
                expiresAt:
                  type: string
                  format: date-time
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Tool
          type: string
          jsonPath: .spec.tool
        - name: Isolation
          type: string
          jsonPath: .spec.isolation.profile
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

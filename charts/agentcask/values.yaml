nameOverride: ""
fullnameOverride: ""

commonLabels: {}
commonAnnotations: {}
imagePullSecrets: []

namespaces:
  system:
    create: false
    name: ""
    labels: {}
    annotations: {}
  sessions:
    create: true
    name: agentcask-sessions
    labels: {}
    annotations: {}

serviceAccounts:
  create: true
  api:
    name: cask-api
    annotations: {}
  controller:
    name: cask-controller
    annotations: {}
  modelProxy:
    name: cask-model-proxy
    annotations: {}
  agentSession:
    name: agent-session
    annotations: {}

rbac:
  create: true
  extraControllerRules: []

sessionToken:
  createSecret: true
  secretName: cask-session-token
  key: tokenSecret
  existingSecret:
    name: ""
    key: tokenSecret

agent:
  image:
    repository: agentcask/agent-runtime
    tag: dev

api:
  name: cask-api
  replicaCount: 1
  image:
    repository: agentcask/cask-api
    tag: dev
    pullPolicy: IfNotPresent
  args:
    addr: ":8080"
  service:
    type: ClusterIP
    port: 8080
  podAnnotations: {}
  podLabels: {}
  resources: {}
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
  nodeSelector: {}
  tolerations: []
  affinity: {}

modelProxy:
  name: cask-model-proxy
  replicaCount: 1
  image:
    repository: agentcask/cask-model-proxy
    tag: dev
    pullPolicy: IfNotPresent
  args:
    addr: ":8080"
  service:
    type: ClusterIP
    port: 8080
  upstream:
    url: ""
    existingSecret:
      name: ""
      key: upstreamKey
  podAnnotations: {}
  podLabels: {}
  resources: {}
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
  nodeSelector: {}
  tolerations: []
  affinity: {}

controller:
  name: cask-controller
  replicaCount: 1
  image:
    repository: agentcask/cask-controller
    tag: dev
    pullPolicy: IfNotPresent
  modelProxyURL: ""
  podAnnotations: {}
  podLabels: {}
  resources: {}
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
  nodeSelector: {}
  tolerations: []
  affinity: {}

networkPolicy:
  enabled: true
  allowDNS: true
  extraEgress: []

runtimeClass:
  create: false
  name: kata
  handler: runc

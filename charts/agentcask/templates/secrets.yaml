{{- if and .Values.sessionToken.createSecret (not .Values.sessionToken.existingSecret.name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentcask.sessionTokenSecretName" . }}
  namespace: {{ include "agentcask.systemNamespace" . }}
  labels:
    {{- include "agentcask.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ include "agentcask.sessionTokenSecretKey" . }}: {{ required "sessionToken.value is required when sessionToken.createSecret=true" .Values.sessionToken.value | quote }}
---
{{- end }}
{{- if and .Values.modelProxy.upstream.createSecret (not .Values.modelProxy.upstream.existingSecret.name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentcask.upstreamSecretName" . }}
  namespace: {{ include "agentcask.systemNamespace" . }}
  labels:
    {{- include "agentcask.componentLabels" (dict "root" . "component" "cask-model-proxy" "app" .Values.modelProxy.name) | nindent 4 }}
type: Opaque
stringData:
  {{ include "agentcask.upstreamSecretKey" . }}: {{ required "modelProxy.upstream.value is required when modelProxy.upstream.createSecret=true" .Values.modelProxy.upstream.value | quote }}
{{- end }}

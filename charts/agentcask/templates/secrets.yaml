{{- if and .Values.sessionToken.createSecret (not .Values.sessionToken.existingSecret.name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentcask.sessionTokenSecretName" . }}
  namespace: {{ include "agentcask.systemNamespace" . }}
  labels:
    {{- include "agentcask.labels" . | nindent 4 }}
type: Opaque
data:
  {{- $existing := lookup "v1" "Secret" (include "agentcask.systemNamespace" .) (include "agentcask.sessionTokenSecretName" .) }}
  {{- $key := include "agentcask.sessionTokenSecretKey" . }}
  {{- if and $existing (hasKey $existing.data $key) }}
  {{ $key }}: {{ index $existing.data $key | quote }}
  {{- else }}
  {{ $key }}: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
{{- end }}

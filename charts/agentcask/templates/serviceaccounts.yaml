{{- if .Values.serviceAccounts.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.api.name }}
  namespace: {{ include "agentcask.systemNamespace" . }}
  labels:
    {{- include "agentcask.componentLabels" (dict "root" . "component" "cask-api" "app" .Values.api.name) | nindent 4 }}
  {{- with .Values.serviceAccounts.api.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.controller.name }}
  namespace: {{ include "agentcask.systemNamespace" . }}
  labels:
    {{- include "agentcask.componentLabels" (dict "root" . "component" "cask-controller" "app" .Values.controller.name) | nindent 4 }}
  {{- with .Values.serviceAccounts.controller.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.modelProxy.name }}
  namespace: {{ include "agentcask.systemNamespace" . }}
  labels:
    {{- include "agentcask.componentLabels" (dict "root" . "component" "cask-model-proxy" "app" .Values.modelProxy.name) | nindent 4 }}
  {{- with .Values.serviceAccounts.modelProxy.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.agentSession.name }}
  namespace: {{ include "agentcask.sessionNamespace" . }}
  labels:
    {{- include "agentcask.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-session
  {{- with .Values.serviceAccounts.agentSession.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - crd

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Check module tidiness
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run tests
        run: make test

      - name: Race detector and static analysis
        run: |
          go test -race ./...
          go vet ./...

      - name: Check reachable Go vulnerabilities
        run: make security-test

      - name: Build binaries
        run: make build

      - name: Build container images
        run: make kind-build-images

      - name: Verify runtime tools and persistent terminal
        run: make runtime-test

  manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Validate Helm chart
        run: |
          make helm-lint
          make helm-template >/tmp/agentcask-helm.yaml
          go test ./test/helm -count=1

      - name: Validate kustomize render
        run: kubectl kustomize --load-restrictor=LoadRestrictionsNone deploy/kind >/tmp/agentcask-kind.yaml

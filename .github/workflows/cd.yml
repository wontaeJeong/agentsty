name: CD

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}/agentcask

jobs:
  publish-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Linux binaries
        run: GOARCH=amd64 make linux-build

      - name: Build and push images
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          for image in cask-api cask-controller cask-model-proxy agent-runtime; do
            docker build -t "${REGISTRY}/${IMAGE_NAMESPACE}/${image}:${VERSION}" -f "build/${image}.Dockerfile" .
            docker push "${REGISTRY}/${IMAGE_NAMESPACE}/${image}:${VERSION}"
          done

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-session-egress
  namespace: agentcask-sessions
spec:
  podSelector:
    matchLabels:
      agentcask.aidev.samsungds.net/component: agent-session
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agentcask-system
          podSelector:
            matchLabels:
              app: cask-model-proxy
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cask-api
  namespace: agentcask-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cask-api
  template:
    metadata:
      labels:
        app: cask-api
    spec:
      serviceAccountName: cask-api
      containers:
        - name: cask-api
          image: agentcask/cask-api:dev
          imagePullPolicy: IfNotPresent
          args:
            - --addr=:8080
            - --namespace=agentcask-sessions
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cask-api
  namespace: agentcask-system
spec:
  selector:
    app: cask-api
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP

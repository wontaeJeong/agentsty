[project]
name = "agentsty-common"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11.0",
  "pydantic-settings>=2.7.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentsty_common"]

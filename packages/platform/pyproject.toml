[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsty-platform"
version = "0.0.0"
description = "Shared production platform boundaries for agentsty"
requires-python = ">=3.13,<3.14"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["agentsty_platform*"]

[tool.setuptools.package-data]
agentsty_platform = ["py.typed", "persistence/migrations/*.sql"]

[project]
name = "agentsty-sandbox"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "agentsty-common",
  "agentsty-storage",
  "pydantic>=2.11.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentsty_sandbox"]

[tool.uv.sources]
agentsty-common = { workspace = true }
agentsty-storage = { workspace = true }
